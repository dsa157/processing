<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hairy Colorful Patches - p5.js</title>
  <!-- p5.js library -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;

      height: 100%;

  <div id="canvas-container"></div>
