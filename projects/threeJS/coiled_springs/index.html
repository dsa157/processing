<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coiled Springs - Generative Three.js Grid</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesque:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Import Map for Elegant Modular ES Modules Loading -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <!-- Centered Canvas Container (Obeying Rule 9, 480x800 size locked) -->
    <div id="canvas-container"></div>

    <!-- HUD Overlay for Performance Monitoring -->
    <div id="hud-overlay">
        <div>FPS: <span id="hud-fps">--</span></div>
        <div>GRID SIZE: <span id="hud-grid">16 x 16</span></div>
        <div>SPRINGS: <span id="hud-springs">256</span></div>
        <div>ACTIVE PALETTE: <span id="hud-palette">Midnight Neon</span></div>
        <div>SEED: <span id="hud-seed">--</span></div>
        <div>VERSION: <span id="hud-version">--</span></div>
    </div>

    <!-- Main Generative Script Module -->
    <script type="module" src="mySketch.js"></script>
</body>

</html>
